<title>PhD Thesis - Information Literacy Scientometrics</title>
<style>
body { font-family: Georgia, 'Times New Roman', serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f4f4f4; color: #333; line-height: 1.7; }
h1 { color: #2c3e50; }
#player { position: sticky; top: 0; background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 100; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }

button:active { transform: scale(0.98); }

#text { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); white-space: pre-wrap; font-size: 1.05em; }
.highlight { background-color: #f1c40f; color: #000; border-radius: 4px; padding: 0 3px; font-weight: bold; box-shadow: 0 0 4px #f39c12; }

<body>
<h1>PhD Thesis Summary<br><small>Information Literacy Scientometrics Analysis</small></h1>
<p>Self-contained player with synchronized word highlighting (Web Speech API). Select a soft female voice if available.</p>

<div id="player">
  <button id="play">▶ Play</button>
  <button id="pause">⏸ Pause</button>
  <button id="stop">⏹ Stop</button>
  <button id="rev">⏪ -10s</button>
  <button id="fwd">⏩ +10s</button>
  <select id="voice-select"><option>Loading voices...</option></select>
  <span id="status">Ready</span>
</div>

<div id="text"></div>

<script>
const fullText = `1. Introduction\n\nScientometric is a technique use for measurement of scientific and technological progress (Garfield 1979). The bibliometric and scientometric both are technique which is used for study various quantitatively and qualitative aspects of scientific endeavors have been studied Scientometrics analysis provides more attention in recent years due to rapid increase in science literature. Scientometrics is the quantitative disciplines of science which is used to measuring published literature and communication. This could be identifying the emerging areas of scientific research, include examination of the development of research by year, or geographical distribution of articles and institution wise distributions of research (Venkatesan, Thanuskodi, 2014).\n\n2. Definitional analysis\n\n2.1 Scientometrics\n\nScientometrics is one of the most important measuring tools for the assessment of scientific productions of journals of communication media (Mooghali et.al, 2011).  It becomes essential indicators for the scientific group of people to estimate the state-of-the-art on the particular research topic (Lolis et. al. 2009). A Scientometrics study focused on quantitative study aspects of the research publications and to find out an emerging trend of study area (Asnani and Vyas, 2020).\n\n2.2 Bibliometrics\n\nThe term bibliometrie was used by Paul Otlet in 1934 in his book Traité de Documentation’ He mentions that it is as measurement of all aspects of publication which is related to the publication output and reading of books and documents (Otlet, 1934).\n\n2.3 Information Literacy\n\nIn today's knowledge society, information has become a essential in order to make the right decisions. “Information Literacy is a set of abilities requiring individuals to recognize when information is needed and have the ability to locate, evaluate, and use effectively the needed information.” by American Library Association,1989 (ALA).\n\nInformation literacy is a crucial skillfulness lay down that empowers persons to find the way the enormous and ever-expanding kingdom of information with self-assurance and discernment.\n\n3.  Objectives of the Research\n\n1. To analyze the growth of literature in Information Literacy.\n\n2. To examine authorship pattern and collaboration trends.\n\n3. To find out the total number of items available on Information Literacy in SCOPUS Database.\n\n4. To identify the subject covered by SCOPUS in Information Literacy.\n\n5. To identify the languages used in Information Literacy.\n\n4. Hypotheses\n\nThe following Hypotheses were taken up for the Present study.\n\n1. Most of the literature is available in English Language in World.\n\n2. There is a significant growth in Information Literacy research globally.\n\n3. There are different types of literature available on Information Literacy.\n\n4. Majority of the contribution were come from Western Countries.\n\n5. Scope and Limitations of the study\n\nThe present study is limited to Scopus data for the 46 years i.e.1974 to 2021, as a source for data collection which comes approximately 14509.\n\n6. Data Collection\n\nThe data have collected from the Scopus Database in the period of the study using the selected parameters viz. issues of title of articles, author and their affiliation, county, and communication channels, authorship pattern etc.\n\n7. Data Analysis and Interpretation\n\nThe collected data have analyzed by using the MS-excel and SPSS package which is presented in tabular and graphical format. In graphical format Bar charts, pie charts, line graphs etc. have used for presentation.\n\n8. Conspectus\n\nPresent study has been divided in the following chapters\n\nChapter-1:- Introduction\n\nThis chapter deals with Preamble, Proposed Research, Definitional analysis, Objectives, Hypothesis, Scope and Limitations, Methodology and Conspectus.\n\nChapter-2:- Review of Literature\n\nExplains definitions of Literacy, Information Literacy, Growth of Information Literacy, Information Explosion, Attitude of LIS Professionals towards Information Literacy and etc. and reviews of earlier related studies in detail literature.\n\nChapter-3:- SCOPUS Database: an Overview\n\nPresents brief profile of SCOPUS, Information Literacy and its objectives, functions and detailed information in general and statistical information particular.\n\nChapter-4:- Data Analysis and Interpretations\n\nThis chapter presents details regarding the procedures adopted in data collection from SCOPUS using a structured questionnaire and subsequent analysis, with SPSS as well as tabular and graphical form followed by interpretation.\n\nChapeter-5:- Conclusion\n\nSummarizes the conclusions and implications of the study.\n\nThe thesis ends with the list of bibliographical references and appendices.\n\n9. Summary of Major Conclusions & Implications\n\n9.1 YEAR WISE DISTRIBUTION OF ARTICLES\n\nFigure no 9.1 shows a total No. of 14509 articles published on Information Literacy on SCOPUS database during 1979 to 2023. The highest number of articles were published in the year 2022,   1407 (9.70%), followed by 2020, 1312 (9.04%) and 2021 (8.98%), the minimum number of articles were published in the year 1979 and 1981 with 1 articles (0.01%), It shows that a tendency of steady increase in the number of articles per year. This indicates that the hypothesis “Vast Growth of Information Literacy is present among the Globe” (Hypothesis No. 2) is valid.\n\n9.2 Authorship Pattern of Articles\n\nfigure No.9.2 shows that the authorship patterns of the articles published during the period of study, out of 14509 articles, it found that 3371 (23.23%) articles had been published by single authors. followed by two authors 3512 (24.21%), three authors 2604 (17.95%), four authors 1658 (11.43%), five authors 1064 (15.50)  and more than five authors 2249 (15.50%) respectively.\n\n9.3 RANKING OF PRODUCTIVE AUTHOR\n\nTable No. 9.3 show that the ranking of authors by article contribution. There are a total of 48897 authors for 14509 articles during the period of study.  Wolf M.S has contributed 43 articles (0.09%), followed by Pinto M 39 (0.08%), Followed by Lloyd A 24 (0.05%) respectively.\n\n9.4 INSTITUTES WISE DISTRIBUTION OF ARTICLES\n\nIt can be observed from Table No. 9.4 shows that, there were 48897 organizations involved in research activity, the organizations that have contributed in the publication during 1974 to 2023. It found that James Lind Initiative, Oxford, United Kingdom is on rank first with 71 publications, it is most productive institution, followed by Wee Kim Wee School of Communication and Information, Nanyang Technological University, 31 Nanyang Link, Singapore, 637718, Singapore is on second rank with 54 publication. Like that many affiliations were contributed in the study table shows the list of affiliations with their product. 19964 are institutions with Single publication.\n\n9.5 Distribution of Authors by Country\n\nFigure No.9.5 shows that the contribution of articles by country during the period under the study. Out of 48897 authors, 15980 (32.68%) are from United States, followed by Australia 5828 (11.92%), United Kingdom 4144 (8.47%), China 2720 (5.56%), Canada 2407 (4.92 %), and publications of the total output. It found that there are 33095 (67.68%) article were published from western countries which include United States 15980 (32.68%), Australia 5828 (11.92%), United Kingdom 4144 (8.47%), Canada 2407 (4.92%), Germany 1897 (3.88%) Spain 1074 (2.20%), Netherland 984 (2.01%), Italy 781 (1.60%), This indicates that the hypothesis “Majority of the contribution were come from Western Countries” (Hypothesis No. 4) is Valid.\n\n9.6 Distribution of Literature in Types of Documents\n\nIt can be observed from Figure No.9.6 shows that, 10080 (69.47%) of the Articles was published in first rank, followed by Conference Paper with 2293 (15.80%) contributions, Review with 974 (6.71%), publications, Book Chapter with 424 (2.92%) respectively. This indicates that the hypothesis “There are different types of literature available on Information Literacy” (Hypothesis No. 3) is valid.\n\n9.7 LANGUAGE WISE DISTRIBUTION OF ARTICLES\n\nFrom table no.9.7 Show that, language wise distribution of publication. Total 14509 publications were published in 1971 to 2023. All publication were published in thirty one language, it found that the 13789 (94.04%) articles published in English language, followed by Spanish 241 (1.66%), German 128 (0.88%), Portugues118 (0.81%), Chinese 51 (0.35), respectively. There for it indicates that hypothesis No. 1 “Most of the literature is available in English Language in World” is valid.\n\n9.8 Ranking of Keywords\n\nTable No. 9.8 show that the ranking list of Keyword is essentially a practical tool designed to help the librarian and research scientist to select the Keyword of maximum utility in relation to their coverage of new and important literature in particular subject area. Table No. shows the frequency of keywords It found that, the high frequency keywords were Information literacy 3640 in first rank, followed by  Health Literacy 1979 with second rank, followed by  Digital literacy 743 in third rank, followed by Academic Libraries with 481 in fourth rank, followed by Education with 319 in fifth rank respectively.\n\n10. Implications\n\nThe researcher has using the bibliometrics and scientometrics tools and techniques of for assessing the information literacy keyword on Scopus Database the study found that researcher have taken whole bibliographical details of  author’s including  name of authors, title of work, source of publication, volume number, issue number, year of publication, place of publication and publisher. Out of total number of 14509 publications published in period 1979 to 2023 on database, it found that author not mention their related information i.e., affiliations, some articles are without place etc. their fore it is very hard to analyze articles properly, for solving the queries bibliographical details should be given by the authors to publishers and publishers also should mention all bibliographical details on respective publication. scientometrics analysis of journals will help the librarians to subscribe useful journals for handle whole library with maintaining standard.\n\nIt also helps research scholars to select the research trends for current information of related subject of particular fields, the study also help to policy and decision makers and researchers.\n\n11. Area for Future of the Study\n\nThe present study was conducted to analysis the keywords base outputs published by Scopus. It has been suggestion on the base of the study following areas may be considered for the undertaking for futures research in library and information subject field.\n\nScientometrics study and deference’s will be conducting in the various subject filed like humanities, Science and Interdisciplinary studies etc., related journals of keywords to know of their publication outputs.\n\n- Research Trends in Health Literacy.\n- Trends in Digital literacy Research.\n- Mapping of Health informatics Research.\n- Mapping of Artificial intelligence Research.\n- Mapping Computer literacy Research.\n\nResearch trends of Consumer health informatics etc. on various online databases like MEDLINE, SCOPUS etc. can also be taken for study.\n\nThank You`;

const textDiv = document.getElementById('text');
const playBtn = document.getElementById('play');
const pauseBtn = document.getElementById('pause');
const stopBtn = document.getElementById('stop');
const revBtn = document.getElementById('rev');
const fwdBtn = document.getElementById('fwd');
const voiceSelect = document.getElementById('voice-select');
const statusEl = document.getElementById('status');

let utterance = null;
let words = [];
let currentWordIndex = 0;
let startOffset = 0;
let isPlaying = false;
let voices = [];

function prepareWords() {
  words = [];
  const regex = /\S+/g;
  let match;
  while ((match = regex.exec(fullText)) !== null) {
    words.push({
      text: match[0],
      start: match.index,
      end: match.index + match[0].length
    });
  }
  renderText();
}

function renderText() {
  textDiv.innerHTML = words.map((w, i) => 
    `<span data-idx="${i}">${escapeHtml(w.text)}</span>`
  ).join(' ');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
}

function highlight(idx) {
  document.querySelectorAll('span.highlight').forEach(el => el.classList.remove('highlight'));
  if (idx >= 0 && idx < words.length) {
    const el = document.querySelector(`span[data-idx="${idx}"]`);
    if (el) {
      el.classList.add('highlight');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function loadVoices() {
  voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = '';
  const preferred = voices.filter(v => 
    v.lang.startsWith('en') && 
    (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman') || 
     ['Samantha','Karen','Moira','Tessa','Fiona','Victoria','Susan','Zira'].some(n => v.name.includes(n)))
  );
  const list = preferred.length ? preferred : voices.filter(v => v.lang.startsWith('en'));
  list.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = voices.indexOf(v);
    opt.textContent = `${v.name} (${v.lang})${v.default ? ' [default]' : ''}`;
    voiceSelect.appendChild(opt);
  });
  if (list.length === 0) {
    voiceSelect.innerHTML = '<option>No English voices</option>';
  }
  if (preferred.length) voiceSelect.value = voices.indexOf(preferred[0]);
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakFrom(charIndex = 0) {
  speechSynthesis.cancel();
  const textToSpeak = fullText.slice(charIndex);
  utterance = new SpeechSynthesisUtterance(textToSpeak);
  utterance.rate = 0.95;
  utterance.pitch = 1.0;
  const selectedIdx = parseInt(voiceSelect.value);
  if (!isNaN(selectedIdx) && voices[selectedIdx]) {
    utterance.voice = voices[selectedIdx];
  }
  utterance.onboundary = (e) => {
    if (e.name === 'word') {
      const absChar = charIndex + e.charIndex;
      const idx = words.findIndex(w => absChar >= w.start && absChar < w.end);
      if (idx !== -1) {
        currentWordIndex = idx;
        highlight(idx);
        statusEl.textContent = `Speaking... word ${idx + 1}/${words.length}`;
      }
    }
  };
  utterance.onend = () => {
    isPlaying = false;
    statusEl.textContent = 'Finished';
    highlight(-1);
  };
  utterance.onerror = (e) => {
    statusEl.textContent = 'Error: ' + e.error;
    isPlaying = false;
  };
  speechSynthesis.speak(utterance);
  isPlaying = true;
  statusEl.textContent = 'Playing...';
}

playBtn.onclick = () => {
  if (speechSynthesis.paused) {
    speechSynthesis.resume();
    isPlaying = true;
    statusEl.textContent = 'Resumed';
  } else {
    speakFrom(startOffset);
  }
};

pauseBtn.onclick = () => {
  if (speechSynthesis.speaking) {
    speechSynthesis.pause();
    isPlaying = false;
    statusEl.textContent = 'Paused';
  }
};

stopBtn.onclick = () => {
  speechSynthesis.cancel();
  isPlaying = false;
  startOffset = 0;
  currentWordIndex = 0;
  highlight(-1);
  statusEl.textContent = 'Stopped';
};

revBtn.onclick = () => {
  const charsBack = 150;
  startOffset = Math.max(0, startOffset - charsBack);
  if (isPlaying || speechSynthesis.speaking) {
    speakFrom(startOffset);
  } else {
    statusEl.textContent = 'Position adjusted (play to resume)';
  }
};

fwdBtn.onclick = () => {
  const charsFwd = 150;
  startOffset = Math.min(fullText.length, startOffset + charsFwd);
  if (isPlaying || speechSynthesis.speaking) {
    speakFrom(startOffset);
  } else {
    statusEl.textContent = 'Position adjusted (play to resume)';
  }
};

prepareWords();
statusEl.textContent = 'Ready - select voice and press Play';
</script>
</body>
</html>
